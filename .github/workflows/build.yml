name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Verify Godot
        run: godot --version

      - name: Import project (headless)
        run: godot --headless --path . --import || true

      - name: Export Windows exe
        run: |
          mkdir -p build
          godot --headless --path . --export-release "Windows Desktop" build/WormFlesh.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WormFlesh-Windows
          path: build/
